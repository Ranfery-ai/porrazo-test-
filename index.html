<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marías Porrazo — Test v3</title><style>
:root{--cardw:clamp(57px,15vw,86px);--cardh:calc(var(--cardw)*1.38)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at center,#256e3a,#092917);color:#fff5dc;font-family:Georgia,serif;min-height:100dvh}header{display:flex;justify-content:space-between;align-items:center;background:#001c13bd;padding:9px;gap:7px}.score{text-align:center;min-width:70px}.score strong{display:block;font-size:32px;color:#ffdc55}.score span{font-size:12px}.centerhead{text-align:center;font-size:14px}.centerhead small{display:block;margin-top:4px}main{height:calc(100dvh - 75px);min-height:450px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px;position:relative}#progress{align-self:flex-start;max-width:100%;font-size:13px;padding:5px 8px;background:#002517dd;border:1px solid #b49a5766;border-radius:7px}#cpu,#player{display:flex;justify-content:center;gap:8px;min-height:var(--cardh)}.label{font-size:12px;color:#e0d4a8}.tablearea{flex:1;min-height:var(--cardh);width:min(100%,440px);display:flex;align-items:center;justify-content:center;position:relative}#table{display:flex;align-items:center;justify-content:center;gap:0;width:100%;min-height:var(--cardh)}#table .card:not(:first-child){margin-left:calc(var(--cardw)*-.55)}#table .card{flex-shrink:0}.card{width:var(--cardw);height:var(--cardh);border:2px solid #d2c7af;border-radius:7px;background:#f9f8f0;box-shadow:2px 4px 9px #0007;color:#111;display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(24px,7vw,38px)}.card.red{color:#bc2020}.card .corner{position:absolute;top:4px;left:5px;font-size:17px;line-height:1}.card .bottom{top:auto;left:auto;bottom:4px;right:5px;transform:rotate(180deg)}.card.back{background:repeating-linear-gradient(40deg,#0e4932 0 8px,#235e41 8px 15px);border-color:#d5b352;color:#e9c45d}.card.back::after{content:'✦'}.card.playable{cursor:pointer;touch-action:manipulation}.card.playable:hover,.card.playable:focus{transform:translateY(-9px);outline:3px solid #ffd35a}#controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;min-height:42px;width:100%}button{font-family:inherit;background:#d7ad36;border:1px solid #ffde65;border-radius:25px;color:#1c190e;font-size:14px;font-weight:bold;padding:10px 15px;min-height:42px;cursor:pointer}button.secondary{background:#193e2e;color:#fff5dc;border-color:#d6ac51}button:disabled{opacity:.4;cursor:default}#start{position:fixed;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);font-size:21px;padding:16px 30px;white-space:nowrap;box-shadow:0 0 0 100vmax #001b1088,0 8px 25px #000a}#start.hide{display:none}#chicaInfo{color:#ffd763;text-align:center;font-size:13px;min-height:16px}#notice{position:fixed;top:30%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:bold;color:#ffe66b;text-shadow:0 3px 10px #000;z-index:12;pointer-events:none;text-align:center}#overlay{display:none;position:fixed;inset:0;background:#001a10ee;z-index:25;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:18px;padding:20px}#overlay.visible{display:flex}#overlay h1{font-size:clamp(24px,7vw,48px);margin:0}#log{position:fixed;left:7px;bottom:5px;max-width:45vw;max-height:37px;overflow:hidden;color:#dfd8c6;font-size:11px;pointer-events:none}#test{display:none}@media(max-height:650px){main{height:auto;min-height:calc(100dvh - 75px)}.tablearea{flex:none;min-height:var(--cardh)}#cpu,#player{min-height:var(--cardh)}}
</style></head><body><header><div class="score"><span>TÚ</span><strong id="ps">0</strong><span>frijoles</span></div><div class="centerhead"><b>MARÍAS PORRAZO</b><small id="round">Ronda 1 · Baraja 40</small></div><div class="score"><span id="cpuName">TÍA</span><strong id="cs">0</strong><span>frijoles</span></div></header><main><div id="progress" aria-live="polite">Presiona Iniciar Partida.</div><div class="label">MANO DE LA TÍA</div><div id="cpu"></div><div class="tablearea"><div id="table"></div></div><div id="chicaInfo" aria-live="polite"></div><div id="controls"><button id="voiceTest" class="secondary" type="button">🔊 Probar voz</button><span id="voiceStatus" role="status" aria-live="polite" style="display:block;max-width:310px;font-size:12px;line-height:1.3;color:#fff3b1"></span><button id="sing" hidden>Cantar chica</button><button id="claim" hidden>Cobrar chica</button><button id="next" hidden>Nueva ronda ▶</button><button class="secondary donate" type="button">PayPal ♡</button></div><div class="label">TU MANO · selecciona una carta</div><div id="player"></div></main><button id="start">INICIAR PARTIDA</button><div id="notice" aria-live="polite"></div><div id="log" aria-live="polite"></div><div id="overlay"><h1 id="result"></h1><p id="resultScore"></p><button id="again">Jugar de nuevo</button><button class="secondary donate">Apoyar con PayPal ♡</button></div><script>
'use strict';
const PAYPAL_URL='https://www.paypal.com/ncp/payment/EX9S9NEJCR7YY'; // Official Porrazo PayPal payment link.
const R=[1,2,3,4,5,6,7,11,12,13],S=['♥','♦','♠','♣'],val=r=>r===13?4:r===12?3:r===11?2:1,rank=r=>({1:'A',11:'J',12:'Q',13:'K'}[r]||r),nextRank=r=>R[(R.indexOf(r)+1)%R.length];
const $=id=>document.getElementById(id),delay=ms=>new Promise(ok=>setTimeout(ok,ms));let g={},lock=false,noticeTimer;
// Speech playback is triggered after a real user gesture (important on mobile).
let voiceEnabled=true, speechReady=false, audioCtx=null;
function unlockAudio(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(C){audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});}
  }catch(e){}
  if('speechSynthesis' in window){
    speechReady=true;
    try{speechSynthesis.getVoices();}catch(e){}
  }
}
let voiceRequest=0;
function voiceStatus(message){
  const box=document.getElementById('voiceStatus');
  if(box)box.textContent=message;
}
function speak(words,diagnostic=false){
  if(!voiceEnabled)return false;
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
    if(diagnostic)voiceStatus('Este navegador no ofrece síntesis de voz.');
    return false;
  }
  try{
    const engine=window.speechSynthesis;
    engine.cancel();
    const available=engine.getVoices();
    const spanish=available.find(v=>v.lang.toLowerCase()==='es-mx')||available.find(v=>v.lang.toLowerCase().startsWith('es'));
    if(diagnostic){
      if(!available.length){voiceStatus('No se encontraron voces instaladas o expuestas por este navegador. Revisa las voces de texto a voz de tu sistema.');return false;}
      if(!spanish){voiceStatus('No hay voz en español. Se probará una voz del sistema ('+available.length+' disponibles).');}
      else voiceStatus('Voz encontrada: '+spanish.name+' ('+spanish.lang+'). Intentando reproducir...');
    }
    const u=new SpeechSynthesisUtterance(words);
    u.lang=spanish?spanish.lang:'es-MX';u.rate=.87;u.volume=1;
    if(spanish)u.voice=spanish;
    const request=++voiceRequest;
    if(diagnostic){
      u.onstart=()=>{if(request===voiceRequest)voiceStatus('La voz comenzó a reproducirse: '+(spanish?spanish.name:'voz predeterminada')+'.');};
      u.onerror=e=>{if(request===voiceRequest)voiceStatus('Error de voz: '+e.error+'. Revisa las voces y el motor de texto a voz del sistema.');};
      u.onend=()=>{if(request===voiceRequest)voiceStatus('Prueba terminada. ¿Escuchaste la frase hablada?');};
    }
    engine.speak(u);
    if(engine.paused)engine.resume();
    return true;
  }catch(e){if(diagnostic)voiceStatus('Error iniciando la voz: '+e.message);return false;}
}
function sound(kind){
  try{
    if(!audioCtx)return;
    let t=audioCtx.currentTime, o=audioCtx.createOscillator(),v=audioCtx.createGain();
    o.type=kind==='porrazo'?'sawtooth':'sine';
    o.frequency.setValueAtTime(kind==='porrazo'?270:kind==='sweep'?500:810,t);
    o.frequency.exponentialRampToValueAtTime(kind==='porrazo'?85:kind==='sweep'?240:560,t+.18);
    v.gain.setValueAtTime(.12,t);v.gain.exponentialRampToValueAtTime(.001,t+.2);
    o.connect(v);v.connect(audioCtx.destination);o.start(t);o.stop(t+.21);
  }catch(e){}
}
function voiceTest(){
  unlockAudio();
  // Do not play a beep: this button tests speech only.
  voiceStatus('Buscando voces...');
  const run=()=>speak('Hola, soy la tía María. ¡Porrazo! ¡Limpia! ¡Chica!',true);
  if(!('speechSynthesis' in window)){voiceStatus('Síntesis de voz no compatible con este navegador.');return;}
  if(window.speechSynthesis.getVoices().length===0){
    const synth=window.speechSynthesis;
    synth.addEventListener('voiceschanged',function ready(){synth.removeEventListener('voiceschanged',ready);run();},{once:true});
    // Some browsers never emit voiceschanged: report a useful diagnosis immediately.
    voiceStatus('No hay voces disponibles todavía. Espera unos segundos y vuelve a pulsar Probar voz.');
  }else run();
}
function announce(t){$('notice').textContent=t;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').textContent='',1700)}
function log(t){$('log').textContent=t}function setProgress(t){$('progress').textContent=t}
function deck(){let a=R.flatMap(r=>S.map(s=>({r,s})));for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function card(c,back=false){let e=document.createElement('div');e.className='card'+(back?' back':(' '+('♥♦'.includes(c.s)?'red':'black')));if(!back){let corner=`${rank(c.r)}<br>${c.s}`;e.innerHTML=`<span class="corner">${corner}</span><span>${c.s}</span><span class="corner bottom">${corner}</span>`;e.setAttribute('aria-label',rank(c.r)+' '+c.s)}return e}
function handChica(h){let counts={};h.forEach(c=>counts[c.r]=(counts[c.r]||0)+1);let r=R.filter(x=>counts[x]>=2).sort((a,b)=>b-a)[0]||null;return{rank:r,played:0,declared:false,rondin:r!==null&&counts[r]===3,rondinPaid:false}}
function reset(){g={phase:'idle',p:0,c:0,round:0,dealer:Math.random()<.5?'p':'c',turn:'p',deck:[],ph:[],ch:[],table:[],pp:[],cp:[],last:null,free:null,deals:0,chicas:null};lock=false;$('overlay').classList.remove('visible');$('start').classList.remove('hide');render()}
function sweep(r,table){let i=table.findIndex(c=>c.r===r);if(i<0)return null;let taken=[table[i]],rest=table.filter((_,k)=>k!==i),cur=r;while(true){let n=nextRank(cur),j=rest.findIndex(c=>c.r===n);if(j<0)break;taken.push(rest.splice(j,1)[0]);cur=n}return taken}
function sweepNext(r,table){let taken=[],rest=table.slice(),cur=r;while(true){let n=nextRank(cur),j=rest.findIndex(c=>c.r===n);if(j<0)break;taken.push(rest.splice(j,1)[0]);cur=n}return taken}
function award(n,who){if(n<=0)return false;sound('points');g[who]+=n;announce('+'+n+' 🫘 '+(who==='p'?'TÚ':'TÍA'));render();if(g.p>=20||g.c>=20){g.phase='over';setTimeout(endGame,650);return true}return false}
function render(){let active=g.phase==='play'&&g.turn==='p'&&!lock;$('ps').textContent=g.p||0;$('cs').textContent=g.c||0;$('round').textContent='Ronda '+(g.round||1)+' · Baraja '+(g.deck?.length||0);$('cpu').replaceChildren(...(g.ch||[]).map(c=>card(c,true)));$('table').replaceChildren(...(g.table||[]).map(c=>card(c)));let a=(g.ph||[]).map((c,i)=>{let e=card(c);if(active){e.classList.add('playable');e.setAttribute('role','button');e.tabIndex=0;e.onclick=()=>playerPlay(i);e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();playerPlay(i)}}}return e});$('player').replaceChildren(...a);let ch=g.chicas,p=ch?.p;let pending=!!(ch&&!ch.settled&&p?.rank&&p.played>=2&&g.phase!=='over');$('sing').hidden=!pending||p.declared;$('claim').hidden=!pending||!p.declared;$('chicaInfo').textContent=pending?('Chica de '+rank(p.rank)+' — '+(p.declared?'cobra tu chica':'canta tu chica')):'';$('next').hidden=g.phase!=='roundend'}
function settleChicas(force=false){const x=g.chicas;if(!x||x.settled)return;const p=x.p,c=x.c;let pp=p.rank&&p.played>=2,cc=c.rank&&c.played>=2;if(!force&&((pp&&c.rank&&!cc)||(cc&&p.rank&&!pp)))return;if(!pp&&!cc)return;if(pp&&!p.declared&&!force&&!cc)return;let winner=pp&&(!cc||p.rank>c.rank)?'p':cc&&(!pp||c.rank>p.rank)?'c':null;if(!winner){if(pp&&cc){x.settled=true;log('Chicas iguales: ninguna puntúa.')}return}if(!force&&!x[winner].declared)return;x.settled=true;log('Chica más alta: '+rank(x[winner].rank));speak('¡Chica!');award(val(x[winner].rank),winner)}
function chicaPlay(c,who){let x=g.chicas;if(!x)return;let ch=x[who];if(c.r===ch.rank)ch.played++;if(ch.rondin&&ch.played===3&&!ch.rondinPaid){ch.rondinPaid=true;award(3*val(ch.rank),who)}if(who==='c'&&ch.rank&&ch.played>=2){ch.declared=true;speak('¡Mi chica!');settleChicas()}else if(x.p.declared||x.c.declared)settleChicas()}
async function play(c,who){chicaPlay(c,who);if(g.phase==='over')return;let captured=[],points=0,porrazo=g.free&&g.free.deal===g.deals&&g.free.by!==who&&g.free.card.r===c.r&&g.table.includes(g.free.card);if(porrazo){const free=g.free.card;g.table.splice(g.table.indexOf(free),1);const trail=sweepNext(c.r,g.table);captured=[free,...trail];points=val(c.r);announce('¡PORRAZO!');sound('porrazo');speak('¡Porrazo!');log('Porrazo de '+rank(c.r)+' +'+points);for(let x of trail)g.table.splice(g.table.indexOf(x),1)}else{captured=sweep(c.r,g.table)||[];for(let x of captured)g.table.splice(g.table.indexOf(x),1)}if(captured.length){sound('sweep');(who==='p'?g.pp:g.cp).push(c,...captured);g.last=who;g.free=null;if(g.table.length===0){let last=captured[captured.length-1];let bonus=val(last.r);points+=bonus;announce('¡LIMPIA! +'+bonus);sound('sweep');speak('¡Limpia!');log('Limpia: última carta '+rank(last.r)+' = '+bonus)}if(points)award(points,who)}else{g.table.push(c);g.free={card:c,by:who,deal:g.deals};log((who==='p'?'Tú':'Tía')+' dejó '+rank(c.r)+' '+c.s)}render();await delay(400)}
function cpuChoose(){let h=g.ch;if(g.free&&g.free.by==='p'&&g.free.deal===g.deals){let p=h.find(c=>c.r===g.free.card.r);if(p)return p}let m=h.map(c=>({c,s:sweep(c.r,g.table)})).filter(x=>x.s).sort((a,b)=>((b.s.length===g.table.length?100:0)+b.s.length)-((a.s.length===g.table.length?100:0)+a.s.length));return m.length?m[0].c:[...h].sort((a,b)=>a.r-b.r)[0]}
async function cpuTurn(){if(g.phase!=='play'||g.turn!=='c')return;lock=true;setProgress('Turno de la Tía…');render();await delay(650);let c=cpuChoose();g.ch.splice(g.ch.indexOf(c),1);await play(c,'c');if(g.phase==='over')return;g.turn='p';lock=false;await finishTurn();if(g.phase==='play'){setProgress('Tu turno · selecciona una carta');render()}}
async function playerPlay(i){if(lock||g.phase!=='play'||g.turn!=='p')return;lock=true;let c=g.ph.splice(i,1)[0];await play(c,'p');if(g.phase==='over')return;g.turn='c';await finishTurn();if(g.phase==='play'){render();await cpuTurn()}}
async function finishTurn(){if(g.ph.length||g.ch.length)return;let x=g.chicas;if(x&&!x.settled&&x.p.rank&&x.p.played>=2&&(!x.c.rank||x.p.rank>x.c.rank)&&!x.p.declared){g.phase='pending';setProgress('Canta tu chica antes del siguiente reparto.');lock=false;render();return}settleChicas(true);if(g.phase==='over')return;await redeal()}
async function redeal(){if(g.deck.length===0){await finishRound();return}if(g.deck.length<=6){announce('¡ÚLTIMAS!');speak('¡Últimas!');}g.ph=g.deck.splice(0,3);g.ch=g.deck.splice(0,3);g.deals++;g.free=null;g.chicas={p:handChica(g.ph),c:handChica(g.ch),settled:false};g.phase='play';lock=false;render()}
async function finishRound(){g.phase='roundend';if(g.table.length&&g.last){(g.last==='p'?g.pp:g.cp).push(...g.table);log('Cartas restantes para '+(g.last==='p'?'tú':'la Tía'))}g.table=[];render();await delay(350);if(award(Math.max(0,g.pp.length-20),'p'))return;if(award(Math.max(0,g.cp.length-20),'c'))return;setProgress('Fin de ronda '+g.round+' · Nueva ronda para continuar.');render()}
async function round(){g.round++;g.phase='dealing';g.ph=[];g.ch=[];g.table=[];g.pp=[];g.cp=[];g.last=null;g.deck=deck();g.ph=g.deck.splice(0,3);g.ch=g.deck.splice(0,3);g.deals++;g.free=null;g.chicas={p:handChica(g.ph),c:handChica(g.ch),settled:false};lock=true;render();setProgress('Ronda '+g.round+' · Tendido · reparte '+(g.dealer==='p'?'Tú':'Tía'));let cards=g.deck.splice(0,4),pts=0;for(let i=0;i<cards.length;i++){g.table.push(cards[i]);render();speak(['As','Dos','Tres','Cuatro'][i]);if(cards[i].r===i+1){pts+=i+1;announce('¡'+['AS','DOS','TRES','CUATRO'][i]+'! +'+(i+1))}await delay(400)}let figs={11:0,12:0,13:0};cards.forEach(c=>{if(c.r>=11)figs[c.r]++});for(const k of [11,12,13]){if(figs[k]>=2)pts+=val(k);if(figs[k]>=3)pts+=3*val(k)}if(pts&&award(pts,g.dealer))return;g.phase='play';g.turn=g.dealer==='p'?'c':'p';lock=false;render();if(g.turn==='c')await cpuTurn();else setProgress('Tu turno: juegas primero porque la Tía repartió.')}
function start(){unlockAudio();reset();$('start').classList.add('hide');round()}
function endGame(){g.phase='over';$('overlay').classList.add('visible');$('result').textContent=g.p>=20?'¡GANASTE! 🎉':'La Tía ganó';$('resultScore').textContent='Tú: '+g.p+' 🫘 · Tía: '+g.c+' 🫘';setProgress('Partida terminada');render()}
$('voiceTest').onclick=voiceTest;$('start').onclick=start;$('again').onclick=start;$('next').onclick=()=>{if(g.phase!=='roundend')return;g.dealer=g.dealer==='p'?'c':'p';round()};$('sing').onclick=()=>{if(!g.chicas)return;g.chicas.p.declared=true;log('Cantaste chica de '+rank(g.chicas.p.rank));speak('¡Mi chica!');render()};$('claim').onclick=async()=>{if(!g.chicas||!g.chicas.p.declared)return;settleChicas();if(g.phase==='pending'){g.phase='play';await finishTurn();if(g.phase==='play'&&g.turn==='c')await cpuTurn()}render()};document.querySelectorAll('.donate').forEach(b=>b.onclick=()=>PAYPAL_URL?window.open(PAYPAL_URL,'_blank','noopener,noreferrer'):alert('Próximamente: enlace PayPal por configurar.'));reset();
</script></body></html>
